services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: starter
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      # Hanya localhost: password root database demo lemah, jangan terbuka ke jaringan.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://app:app@db:3306/starter
      # Nilai demo palsu. Ganti lewat variabel lingkungan untuk deployment nyata.
      JWT_SECRET: ${JWT_SECRET:-demo-only-secret-ganti-di-deployment-0123456789}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_EXPIRES_DAYS: ${REFRESH_EXPIRES_DAYS:-7}
      # Compose ini untuk demo lokal, jadi akun demo di-seed. Matikan di deployment nyata.
      SEED_DEMO: ${SEED_DEMO:-true}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  mysqldata:
